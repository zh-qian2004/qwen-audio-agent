  # ============ 2026-11-09 22:42 实机验证新增 ============

  - id: get_up_gait10
    display_name: 起身站立（跌倒爬起步态）
    description: 机器人仰躺/俯卧且舵机失能时，发送 gait 10 触发 wbc 原生 get-up 恢复序列，起身至双足站立待命（Bipedal_Movement_mode + STOP_STATE）。2026-11-09 22:42 已实机验证成功。
    category: body_motion
    readiness: ready
    risk: medium

    interface:
      mechanism: ros_topic_mid_layer
      name: /ControlBipedMotion_topic
      type: plan/msg/BipedMotionCmd
      provider_node: /control (wbc_ctrl_plugin)

    physical_effect:
      moves_head: false
      moves_arms: false
      moves_legs: true
      moves_base: true

    parameters:
      - name: control_mode
        type: uint8
        required: true
        value: 1  # MODE_WALK_GAIT
        note: ""
      - name: gait_type
        type: uint8
        required: true
        value: 10  # GAIT_FALLING_DOWN_AND_GEITTING_UP 前向趴倒跌倒爬起；仰躺实际由 wbc 按 FALLING_ON_BACK_AND_GETTING_UP_STATE 处理
        note: "11 = 后仰爬起(带姿态调整)。其余字段填 0"

    preconditions:
      robot_online: true
      no_active_action: true
      lying_or_crouched: true
      battery_above_6_percent: true

    feedback:
      source: "/ControlBipedMotionFeedback_topic + /userdata/log/control/wbc_ctrl_plugin.log"
      running_condition: "feedback gait 离开 53/29，HardwareMotorCurrent 非零（实测峰值 812）"
      success_condition: "feedback (1, 0)，wbc: Motor_Disable_mode --> Bipedal_Movement_mode 且 state --> STOP_STATE，IMU pitch ≈ 0.9°"
      failure_condition: "wbc 日志出现 reject / unknown gait_type；25s 内状态未变化"

    cancellation:
      supported: null
      mechanism: "一次性动作（约 8s）自然结束；gait 0 / webctl MOTION_STOP 是否可中断爬起过程未验证"
      verified: false

    timeout_seconds: 20
    concurrency_group: robot_motion
    confirmed_on_hardware: true
    dashboard_enabled: false

    evidence:
      - "实机验证 2026-11-09 22:42:24-32：gait 10 发布后 8s 完成起身，IMU -68° → 0.9°"
      - "robot:/userdata/log/control/wbc_ctrl_plugin.log（FALLING_ON_BACK_AND_GETTING_UP_STATE --> STOP_STATE）"
      - "wbc 启动即等待：'current: servos unloaded, waiting for get-up / please perform get-up to finish init'"
    blockers:
      - 爬起过程中途取消未验证（动作仅 8s，风险有限）
      - gait 10 与 11 的适用姿态（俯卧 vs 仰躺）选择逻辑未完全确认（本次仰躺用 10 成功）

